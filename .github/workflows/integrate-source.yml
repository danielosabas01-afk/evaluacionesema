name: Integrar fuente real EMA MAYOREO

on:
  push:
    branches: [main]
    paths:
      - '.github/source-parts/READY'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Restaurar archivos originales del proyecto
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, shutil, tarfile, tempfile
          repo = Path.cwd()
          parts_dir = repo / ".github" / "source-parts"
          parts = sorted(parts_dir.glob("part-*.b64"))
          if not parts:
              raise SystemExit("Faltan los bloques de la fuente original.")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          archive_bytes = base64.b64decode(encoded, validate=True)
          with tempfile.TemporaryDirectory() as work:
              workdir = Path(work)
              archive = workdir / "ema-source.tar.xz"
              archive.write_bytes(archive_bytes)
              with tarfile.open(archive, "r:*") as tf:
                  members = tf.getmembers()
                  if any(Path(m.name).is_absolute() or ".." in Path(m.name).parts for m in members):
                      raise SystemExit("El paquete tiene rutas no permitidas.")
                  tf.extractall(workdir / "source", filter="data")
              source = workdir / "source"
              if not (source / "data_engine.py").is_file() or not (source / "web" / "index.html").is_file():
                  raise SystemExit("El paquete no coincide con los archivos originales de EMA.")
              for item in source.iterdir():
                  if item.name == "web":
                      shutil.copytree(item, repo / "web", dirs_exist_ok=True)
                  elif item.name == ".gitignore":
                      shutil.copy2(item, repo / ".gitignore")
                  elif item.is_dir():
                      shutil.copytree(item, repo / item.name, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, repo / item.name)
              web = repo / "web"
              for asset in web.iterdir():
                  if asset.is_file():
                      shutil.copy2(asset, repo / asset.name)
              index = repo / "index.html"
              html = index.read_text(encoding="utf-8")
              asset_names = [
                  "manifest.webmanifest", "icon.svg", "styles.css",
                  "command-center.css", "premium-overrides.css", "ema-logo.jpg",
                  "guatemala-map.svg", "gsap-loader.js", "motion-engine.js",
                  "loaders.js", "quality-assistant.js", "app.js",
                  "monthly-comparison.js", "command-center.js", "api-config.js",
              ]
              for name in asset_names:
                  html = html.replace(f'="/{name}', f'="./{name}')
                  html = html.replace(f"='/{name}", f"='./{name}")
              html = html.replace('href="/#', 'href="#')
              html = html.replace('src="/warehouse-silhouette.svg', 'src="./warehouse-silhouette.svg')
              index.write_text(html, encoding="utf-8")
          shutil.rmtree(parts_dir, ignore_errors=True)
          print("Se integraron la interfaz EMA 64.0.0, recursos, módulos JS/CSS, servidor Python y herramientas. Los historiales comerciales no forman parte del paquete.")
          PY
      - name: Guardar los archivos integrados en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios de integración."
          else
            git commit -m "feat: restore real EMA Mayoreo application source"
            git push origin HEAD:main
          fi
